name: whatsapp-booking-test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: whatsapp-booking-test-db
    restart: "no"
    environment:
      POSTGRES_DB: whatsapp_test
      POSTGRES_USER: whatsapp_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?set POSTGRES_TEST_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
