name: PostgreSQL migration 0008

on:
  pull_request:
    paths:
      - 'alembic/**'
      - 'app/models/domain.py'
      - 'tests/integration/test_migration_0008_postgresql.py'
      - 'tests/test_operational_migration_0008.py'
      - 'requirements*.txt'
      - '.github/workflows/migration-0008-postgresql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-0008:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alovia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alovia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alovia_test
      ALEMBIC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alovia_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Physical migration roundtrip
        run: >-
          pytest
          tests/integration/test_migration_0008_postgresql.py::test_migration_0008_roundtrip_preserves_pending_status_and_notes
          -q -p no:cacheprovider

      - name: Directed migration and operational tests
        run: >-
          pytest
          tests/test_operational_migration_0008.py
          tests/test_operational_pwa.py
          -q -p no:cacheprovider

      - name: Compile application
        run: python -m compileall app

      - name: Check dependencies
        run: python -m pip check

      - name: Diff check
        run: git diff --check
