name: Conversation Lab

on:
  push:
    branches:
      - test/productivity-conversation-lab
    paths:
      - 'app/conversation_lab/**'
      - 'app/conversations/**'
      - 'Dockerfile.conversation-lab'
      - 'docs/conversation-lab.md'
      - '.github/workflows/conversation-lab.yml'
  pull_request:
    paths:
      - 'app/conversation_lab/**'
      - 'app/conversations/**'
      - 'Dockerfile.conversation-lab'
      - 'docs/conversation-lab.md'
      - '.github/workflows/conversation-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      CONVERSATION_LAB_ALLOW_EXTERNAL_IO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-prod.txt
      - run: python -m compileall app/conversation_lab app/conversations
      - run: python -m app.conversation_lab.runner --mode regression
      - run: git diff --check

  discovery-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stage:
          - semantic
          - context
          - flow
          - journey
    env:
      ENVIRONMENT: test
      CONVERSATION_LAB_ALLOW_EXTERNAL_IO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-prod.txt
      - run: python -m app.conversation_lab.runner --mode discovery --per-seed 12 --stage ${{ matrix.stage }}
