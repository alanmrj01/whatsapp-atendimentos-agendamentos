name: Conversation Lab

on:
  push:
    branches:
      - test/productivity-conversation-lab
    paths:
      - 'app/conversation_lab/**'
      - 'app/conversations/**'
      - 'Dockerfile.conversation-lab'
      - 'docs/conversation-lab.md'
      - '.github/workflows/conversation-lab.yml'
  pull_request:
    paths:
      - 'app/conversation_lab/**'
      - 'app/conversations/**'
      - 'Dockerfile.conversation-lab'
      - 'docs/conversation-lab.md'
      - '.github/workflows/conversation-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      CONVERSATION_LAB_ALLOW_EXTERNAL_IO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-prod.txt
      - run: python -m compileall app/conversation_lab app/conversations
      - run: python -m app.conversation_lab.runner --mode regression
      - run: git diff --check

  discovery-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: semantic, shard_index: 0, shard_count: 1 }
          - { stage: context, shard_index: 0, shard_count: 4 }
          - { stage: context, shard_index: 1, shard_count: 4 }
          - { stage: context, shard_index: 2, shard_count: 4 }
          - { stage: context, shard_index: 3, shard_count: 4 }
          - { stage: flow, shard_index: 0, shard_count: 2 }
          - { stage: flow, shard_index: 1, shard_count: 2 }
          - { stage: journey, shard_index: 0, shard_count: 4 }
          - { stage: journey, shard_index: 1, shard_count: 4 }
          - { stage: journey, shard_index: 2, shard_count: 4 }
          - { stage: journey, shard_index: 3, shard_count: 4 }
    env:
      ENVIRONMENT: test
      CONVERSATION_LAB_ALLOW_EXTERNAL_IO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-prod.txt
      - run: >-
          python -m app.conversation_lab.runner
          --mode discovery
          --per-seed 12
          --stage ${{ matrix.stage }}
          --shard-index ${{ matrix.shard_index }}
          --shard-count ${{ matrix.shard_count }}
