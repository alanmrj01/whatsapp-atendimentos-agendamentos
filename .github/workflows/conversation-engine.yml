name: Conversation engine validation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/conversations/**'
      - 'app/booking/**'
      - 'app/automation/**'
      - 'app/repositories/conversations.py'
      - 'app/repositories/automation.py'
      - 'app/repositories/cloud_tasks.py'
      - 'app/repositories/outbound_tasks.py'
      - 'app/operations/service.py'
      - 'app/tasks/cloud_tasks.py'
      - 'app/tasks/outbound.py'
      - 'app/tasks/worker.py'
      - 'app/whatsapp/processor.py'
      - 'tests/test_conversation_*.py'
      - 'tests/conversation_stress/test_round3_orchestration.py'
      - 'tests/test_service_semantics.py'
      - 'tests/test_cloud_tasks.py'
      - 'tests/test_automation_policy.py'
      - 'tests/integration/test_automation_postgresql.py'
      - 'tests/test_dialogue.py'
      - 'tests/test_booking_availability.py'
      - 'tests/test_booking_travel.py'
      - 'tests/test_equipment_recommendation.py'
      - 'tests/test_outbound_tasks.py'
      - 'tests/test_operational_pwa.py'
      - 'tests/test_whatsapp_webhook.py'
      - '.github/workflows/conversation-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversation-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: alovia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d alovia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/alovia_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile application and tests
        run: python -m compileall app tests

      - name: Conversation tests
        run: >-
          pytest
          tests/test_conversation_interpreter.py
          tests/test_conversation_engine.py
          tests/test_conversation_robustness.py
          tests/conversation_stress
          tests/test_conversation_repository.py
          tests/test_service_semantics.py
          tests/test_handoff_reactivation.py
          tests/test_cloud_tasks.py
          tests/test_automation_policy.py
          tests/test_dialogue.py
          tests/test_booking_availability.py
          tests/test_booking_travel.py
          tests/test_equipment_recommendation.py
          tests/test_outbound_tasks.py
          tests/test_operational_pwa.py
          tests/test_whatsapp_webhook.py
          -q -p no:cacheprovider

      # Invariantes essenciais executados em toda alteração do motor,
      # mesmo quando a mudança parecer restrita a uma resposta comercial.
      - name: Critical customer journeys smoke
        run: >-
          pytest
          tests/test_whatsapp_webhook.py::test_active_fixed_exclusion_prevents_engine_and_outbound
          tests/test_whatsapp_webhook.py::test_legacy_local_exclusion_blocks_canonical_inbound_before_engine
          tests/test_outbound_tasks.py::test_repository_final_send_barrier_blocks_legacy_local_exclusion
          tests/test_conversation_engine.py::test_full_booking_flow_persists_canonical_states_and_context
          tests/test_conversation_engine.py::test_installation_quote_request_prioritizes_service_over_equipment_catalog
          tests/test_conversation_engine.py::test_installation_quote_collects_tubing_before_address_and_pricing
          tests/test_conversation_engine.py::test_address_required_price_question_still_gives_base_with_caveat
          tests/test_conversation_engine.py::test_required_service_address_is_collected_only_after_date_and_time
          tests/test_conversation_engine.py::test_selected_time_collects_attendee_and_confirms_whatsapp_before_final_confirmation
          tests/test_conversation_engine.py::test_slot_unavailable_does_not_complete_booking
          tests/test_conversation_engine.py::test_handoff_creates_last_outbound_then_disables_automation
          tests/test_conversation_engine.py::test_book_request_while_choosing_service_does_not_loop_menu_copy
          tests/test_conversation_engine.py::test_repeated_invalid_interactive_id_handoffs_instead_of_looping
          tests/test_booking_availability.py::test_real_confirmation_still_rejects_missing_required_address
          -q -p no:cacheprovider

      - name: Critical lifecycle on physical PostgreSQL
        run: >-
          pytest
          tests/integration/test_booking_postgresql_additional.py::test_preventive_outreach_can_be_fast_forwarded_without_waiting_six_months
          tests/integration/test_automation_postgresql.py::test_paused_conversation_blocks_queued_worker_before_engine
          tests/integration/test_automation_postgresql.py::test_paused_conversation_blocks_pending_outbound_before_meta_call
          tests/integration/test_automation_postgresql.py::test_pause_cancels_automatic_pending_but_preserves_manual_outbound
          tests/integration/test_automation_postgresql.py::test_pause_confirmation_waits_for_already_started_automatic_send
          -q -p no:cacheprovider

      - name: Critical blocked-contact safety gate
        run: >-
          pytest
          tests/test_outbound_tasks.py::test_repository_final_send_barrier_blocks_legacy_local_exclusion
          tests/test_outbound_tasks.py::test_excluded_or_human_controlled_recipient_is_not_sent
          tests/test_outbound_tasks.py::test_handoff_notice_bypasses_only_standard_automation_block
          tests/test_whatsapp_webhook.py::test_legacy_local_exclusion_blocks_canonical_inbound_before_engine
          tests/integration/test_automation_postgresql.py::test_ignore_human_only_deactivation_and_multitenancy
          tests/integration/test_automation_postgresql.py::test_paused_conversation_blocks_pending_outbound_before_meta_call
          -q -p no:cacheprovider

      - name: Check dependencies
        run: python -m pip check

      - name: Diff check
        run: git diff --check
