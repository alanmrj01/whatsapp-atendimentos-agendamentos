name: Billing validation

on:
  push:
    branches: [main]
    paths:
      - 'app/billing/**'
      - 'app/api/billing.py'
      - 'app/api/asaas_webhook.py'
      - 'app/models/billing.py'
      - 'tests/test_billing_*.py'
      - 'tests/integration/test_billing_postgresql.py'
      - '.github/workflows/billing-validation.yml'
  pull_request:
    paths:
      - 'app/billing/**'
      - 'app/api/billing.py'
      - 'app/api/asaas_webhook.py'
      - 'app/models/billing.py'
      - 'tests/test_billing_*.py'
      - 'tests/integration/test_billing_postgresql.py'
      - '.github/workflows/billing-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: alovia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d alovia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/alovia_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile billing application and tests
        run: python -m compileall app/billing app/api/billing.py app/api/asaas_webhook.py tests/test_billing_foundation.py tests/test_billing_guarantee.py tests/integration/test_billing_postgresql.py

      - name: Billing tests
        run: >-
          pytest
          tests/test_billing_foundation.py
          tests/test_billing_guarantee.py
          tests/integration/test_billing_postgresql.py
          -q -p no:cacheprovider

      - name: Check dependencies
        run: python -m pip check

      - name: Diff check
        run: git diff --check
