name: Conversation Lab Mass

on:
  push:
    branches:
      - test/discovery-round9-language-catalog-professionalism
    paths:
      - '.github/workflows/conversation-lab-mass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-mass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: semantic, shard_index: 0, shard_count: 1 }
          - { stage: context, shard_index: 0, shard_count: 6 }
          - { stage: context, shard_index: 1, shard_count: 6 }
          - { stage: context, shard_index: 2, shard_count: 6 }
          - { stage: context, shard_index: 3, shard_count: 6 }
          - { stage: context, shard_index: 4, shard_count: 6 }
          - { stage: context, shard_index: 5, shard_count: 6 }
          - { stage: flow, shard_index: 0, shard_count: 8 }
          - { stage: flow, shard_index: 1, shard_count: 8 }
          - { stage: flow, shard_index: 2, shard_count: 8 }
          - { stage: flow, shard_index: 3, shard_count: 8 }
          - { stage: flow, shard_index: 4, shard_count: 8 }
          - { stage: flow, shard_index: 5, shard_count: 8 }
          - { stage: flow, shard_index: 6, shard_count: 8 }
          - { stage: flow, shard_index: 7, shard_count: 8 }
          - { stage: journey, shard_index: 0, shard_count: 8 }
          - { stage: journey, shard_index: 1, shard_count: 8 }
          - { stage: journey, shard_index: 2, shard_count: 8 }
          - { stage: journey, shard_index: 3, shard_count: 8 }
          - { stage: journey, shard_index: 4, shard_count: 8 }
          - { stage: journey, shard_index: 5, shard_count: 8 }
          - { stage: journey, shard_index: 6, shard_count: 8 }
          - { stage: journey, shard_index: 7, shard_count: 8 }
    env:
      ENVIRONMENT: test
      CONVERSATION_LAB_ALLOW_EXTERNAL_IO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-prod.txt
      - run: >-
          python -m app.conversation_lab.runner
          --mode discovery
          --per-seed 120
          --stage ${{ matrix.stage }}
          --shard-index ${{ matrix.shard_index }}
          --shard-count ${{ matrix.shard_count }}
